    // Function to set language preference
    function setLanguage(lang) {
        document.cookie = `lang=${lang};path=/;max-age=${30 * 24 * 60 * 60}`;
        applyTranslations(lang);
    }

    // Function to apply translations
    function applyTranslations(lang) {
        const langData = translations[lang] || translations['en'];
        
        // Update all elements with data-translate attribute
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            if (langData[key]) {
                el.textContent = langData[key];
            }
        });

        // Update dropdown button text
        const dropdownBtn = document.getElementById('languageDropdown');
        if (dropdownBtn) {
            dropdownBtn.innerHTML = `<i class="fas fa-language"></i> ${langData['language']}`;
        }
    }

    // Function to get language from cookie
    function getLanguage() {
        const cookie = document.cookie.split('; ').find(row => row.startsWith('lang='));
        return cookie ? cookie.split('=')[1] : 'en';
    }

    // Initialize language on page load
    document.addEventListener('DOMContentLoaded', function() {
        const lang = getLanguage();
        applyTranslations(lang);
    });
</script>

    <style>
        :root {
            --primary-dark: #0d2818;
            --primary: #164a23;
            --primary-light: #2d724c;
            --accent: #4ECC5A;
            --text-light: #e9f5ea;
            --text-muted: #a0c9a4;
            --dark-overlay: rgba(0, 20, 0, 0.7);
            --card-bg: #162621;
            --card-border: #2a413a;
        }

        body {
            background-color: var(--primary-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--primary) !important;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .navbar-dark .navbar-brand {
            color: white;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .navbar-dark .navbar-brand:hover {
            background-color: var(--primary-light);
            color: white;
            transform: translateY(-2px);
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-weight: 500;
            margin: 0 5px;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .bg-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .bg-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--accent);
            font-weight: 600;
        }

        .lead {
            color: var(--text-light);
        }

        .btn-primary {
            background-color: var(--primary-light);
            border-color: var(--primary-light);
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-outline-success {
            color: var(--accent);
            border-color: var(--accent);
            background-color: transparent;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-outline-success:hover {
            background-color: var(--accent);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .footer-basic {
            padding: 40px 0;
            background-color: var(--primary);
            margin-top: auto;
        }

        .footer-basic ul {
            padding: 0;
            list-style: none;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 0;
        }

        .footer-basic li {
            padding: 0 10px;
        }

        .footer-basic ul a {
            color: var(--text-light);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .footer-basic ul a:hover {
            opacity: 1;
            color: var(--accent);
        }

        .footer-basic .social {
            text-align: center;
            padding-bottom: 25px;
        }

        .footer-basic .social>a {
            font-size: 24px;
            width: 40px;
            height: 40px;
            line-height: 40px;
            display: inline-block;
            text-align: center;
            border-radius: 50%;
            border: 1px solid var(--text-muted);
            margin: 0 8px;
            color: var(--text-light);
            opacity: 0.75;
            transition: all 0.3s ease;
        }

        .footer-basic .social>a:hover {
            opacity: 1;
            background-color: var(--accent);
            color: var(--primary-dark);
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .footer-basic .copyright {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        /* File upload styling */
        .file-upload input[type='file'] {
            display: none;
        }

        .custom-file-label {
            background-color: var(--primary-light);
            color: white;
            padding: 12px 20px;
            font-family: sans-serif;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .custom-file-label:hover {
            background-color: var(--accent);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        #file-chosen {
            margin-left: 0.3rem;
            font-family: sans-serif;
            color: var(--text-muted);
        }

        /* Custom Container */
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Animated elements */
        .animated-item {
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Media queries */
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

     <script>
        function changeLanguage(lang) {
            // Set a cookie with the selected language that expires in 30 days
            document.cookie = `lang=${lang}; path=/; max-age=${30 * 24 * 60 * 60}`;
            
            // Reload the page to apply the language change
            window.location.reload();
        }
        
        // Check for saved language preference on page load
        document.addEventListener('DOMContentLoaded', function() {
            const langCookie = document.cookie.split('; ').find(row => row.startsWith('lang='));
            if (langCookie) {
                const lang = langCookie.split('=')[1];
                const dropdownBtn = document.getElementById('languageDropdown');
                const languageNames = {
                    'en': 'English',
                    'hi': 'हिंदी',
                    'ta': 'தமிழ்',
                    'te': 'తెలుగు',
                    'kn': 'ಕನ್ನಡ',
                    'ml': 'മലയാളം',
                    'bn': 'বাংলা'
                };
                dropdownBtn.innerHTML = `<i class="fas fa-language"></i> ${languageNames[lang]}`;
            }
        });
    </script>
